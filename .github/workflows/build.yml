name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir -p source
          unzip -o PoolAimAssistant-AndroidStudio.zip -d source

      - name: Fix project
        run: |
          cd source/PoolAimAssistant
          sed -i 's/compileSdk = 35/compileSdk = 35\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    kotlinOptions { jvmTarget = "17" }/' app/build.gradle.kts

      - name: Write overlay service
        run: |
          cd source/PoolAimAssistant
          cat > app/src/main/java/com/example/poolaimassistant/AimOverlayService.kt <<'EOF'
          package com.example.poolaimassistant

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView

          class AimOverlayService : Service() {
              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              private var aimView: AimOverlayView? = null
              private var aimParams: WindowManager.LayoutParams? = null
              private var mode = 0 // 0 = tutup, 1 = tandai, 2 = kunci

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  showAimLayer()
                  showBubble()
                  applyMode()
              }

              private fun overlayType(): Int =
                  WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY

              private fun showAimLayer() {
                  val v = AimOverlayView(this)
                  val p = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      alpha = 0.8f
                  }
                  aimView = v
                  aimParams = p
                  wm.addView(v, p)
              }

              private fun showBubble() {
                  val b = TextView(this).apply {
                      text = "AIM"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.rgb(18, 125, 90))
                      setOnClickListener {
                          mode = (mode + 1) % 3
                          applyMode()
                      }
                      setOnLongClickListener {
                          stopSelf()
                          true
                      }
                  }
                  val p = WindowManager.LayoutParams(
                      dp(56), dp(56), overlayType(),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dp(18); y = dp(180)
                  }
                  bubble = b
                  wm.addView(b, p)
              }

              private fun applyMode() {
                  val v = aimView ?: return
                  val p = aimParams ?: return
                  var flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS
                  if (mode != 1) flags = flags or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                  p.flags = flags
                  v.visibility = if (mode == 0) View.GONE else View.VISIBLE
                  v.locked = (mode == 2)
                  if (mode == 0) v.resetIfClosed(true)
                  wm.updateViewLayout(v, p)
                  bubble?.text = when (mode) {
                      1 -> "KUNCI"
                      2 -> "TUTUP"
                      else -> "AIM"
                  }
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onDestroy() {
                  bubble?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  aimView?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  bubble = null
                  aimView = null
                  super.onDestroy()
              }
          }
          EOF

      - name: Write overlay view
        run: |
          cd source/PoolAimAssistant
          cat > app/src/main/java/com/example/poolaimassistant/AimOverlayView.kt <<'EOF'
          package com.example.poolaimassistant

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.Typeface
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.acos
          import kotlin.math.hypot

          /**
           * Overlay manual: kalibrasi 2 titik lubang meja, tandai bola target,
           * lalu (opsional) bola putih dan bola penghalang. Kursor digerakkan dengan
           * joystick analog, titik dipasang dengan tombol PASANG. Hanya menghitung garis
           * bantu dari titik yang ditandai manual. Tidak membaca layar dan tidak
           * mengendalikan game.
           */
          class AimOverlayView(context: Context) : View(context) {
              private class Pt(val x: Float, val y: Float)

              private val calib = mutableListOf<Pt>()
              private val shot = mutableListOf<Pt>() // [0] target, [1] putih (opsional), [2..] penghalang

              private var cursorX = -1f
              private var cursorY = -1f
              private var joyId = -1
              private var joyDx = 0f
              private var joyDy = 0f

              var locked = false
                  set(v) {
                      field = v
                      joyId = -1
                      joyDx = 0f
                      joyDy = 0f
                      invalidate()
                  }

              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = dp(2.2f)
                  strokeCap = Paint.Cap.ROUND
              }
              private val ring = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = dp(2f)
              }
              private val dot = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
              private val text = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = dp(14f)
                  typeface = Typeface.create("sans-serif-medium", Typeface.BOLD)
              }
              private val panel = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = 0xCC101820.toInt()
                  style = Paint.Style.FILL
              }

              private fun jx(): Float = dp(90f)
              private fun jy(): Float = height - dp(90f)
              private fun jr(): Float = dp(56f)
              private fun padLeft(): Float = width - dp(170f)
              private fun padTop(): Float = height - dp(120f)
              private fun padRight(): Float = width - dp(60f)
              private fun padBottom(): Float = height - dp(50f)

              private fun ensureCursor() {
                  if (cursorX < 0f && width > 0) {
                      cursorX = width / 2f
                      cursorY = height / 2f
                  }
              }

              private fun pockets(): List<Pt> {
                  val a = calib[0]
                  val b = calib[1]
                  val x1 = minOf(a.x, b.x)
                  val x2 = maxOf(a.x, b.x)
                  val y1 = minOf(a.y, b.y)
                  val y2 = maxOf(a.y, b.y)
                  val mx = (x1 + x2) / 2f
                  return listOf(Pt(x1, y1), Pt(mx, y1), Pt(x2, y1), Pt(x1, y2), Pt(mx, y2), Pt(x2, y2))
              }

              private fun pocketName(i: Int): String =
                  listOf("kiri atas", "tengah atas", "kanan atas", "kiri bawah", "tengah bawah", "kanan bawah")[i]

              private fun distToSeg(px: Float, py: Float, ax: Float, ay: Float, bx: Float, by: Float): Float {
                  val vx = bx - ax
                  val vy = by - ay
                  val l2 = vx * vx + vy * vy
                  if (l2 < 0.000001f) return hypot(px - ax, py - ay)
                  val t = (((px - ax) * vx + (py - ay) * vy) / l2).coerceIn(0f, 1f)
                  return hypot(px - (ax + t * vx), py - (ay + t * vy))
              }

              private fun blocked(pts: List<Pt>, ax: Float, ay: Float, bx: Float, by: Float, r: Float): Boolean {
                  for (i in 2 until pts.size) {
                      if (distToSeg(pts[i].x, pts[i].y, ax, ay, bx, by) < 1.9f * r) return true
                  }
                  return false
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (visibility != VISIBLE) return

                  ensureCursor()
                  if (joyId != -1 && !locked) {
                      val m = hypot(joyDx, joyDy)
                      if (m > 0.05f) {
                          cursorX = (cursorX + joyDx * m * dp(6f)).coerceIn(0f, width.toFloat())
                          cursorY = (cursorY + joyDy * m * dp(6f)).coerceIn(0f, height.toFloat())
                      }
                      postInvalidateOnAnimation()
                  }

                  val pd: Pt? = if (!locked && cursorX >= 0f) Pt(cursorX, cursorY) else null
                  val pts: List<Pt> = if (pd != null && calib.size == 2 && shot.size < 10) shot + pd else shot

                  if (!locked) {
                      canvas.drawRoundRect(dp(12f), dp(36f), width - dp(12f), dp(106f), dp(12f), dp(12f), panel)
                      val instruction = when {
                          calib.size == 0 -> "Kalibrasi 1/2  Kursor ke lubang KIRI ATAS, tekan PASANG"
                          calib.size == 1 -> "Kalibrasi 2/2  Kursor ke lubang KANAN BAWAH, tekan PASANG"
                          shot.size == 0 -> "Kursor ke bola yang mau dimasukkan, tekan PASANG"
                          shot.size == 1 -> "Opsional: pasang bola putih biar lebih tepat. Lalu KUNCI"
                          else -> "Opsional: pasang bola penghalang. Lalu KUNCI"
                      }
                      canvas.drawText(instruction, dp(24f), dp(64f), text)
                      text.textSize = dp(11f)
                      canvas.drawText("Mode manual - hanya garis bantu, tidak mengendalikan game", dp(24f), dp(87f), text)
                      text.textSize = dp(14f)

                      ring.color = Color.CYAN
                      if (calib.size == 2) {
                          for (p in pockets()) canvas.drawCircle(p.x, p.y, dp(10f), ring)
                      } else {
                          for (p in calib) canvas.drawCircle(p.x, p.y, dp(10f), ring)
                      }
                  }

                  if (calib.size == 2 && pts.size >= 1) {
                      val t = pts[0]
                      val c: Pt? = if (pts.size >= 2) pts[1] else null
                      drawPoint(canvas, t, Color.YELLOW, "TARGET")
                      if (c != null) drawPoint(canvas, c, Color.WHITE, "CUE")
                      val ps = pockets()
                      val w = ps[2].x - ps[0].x
                      val r = w * 0.0148f
                      for (i in 2 until pts.size) {
                          ring.color = Color.RED
                          canvas.drawCircle(pts[i].x, pts[i].y, r, ring)
                      }
                      var best = -1
                      var bestScore = Float.MAX_VALUE
                      var bestCut = 0f
                      var bgx = 0f
                      var bgy = 0f
                      var blockedCount = 0
                      for (i in ps.indices) {
                          val p = ps[i]
                          val tx = p.x - t.x
                          val ty = p.y - t.y
                          val tl = hypot(tx, ty)
                          if (tl < 1f) continue
                          val dx = tx / tl
                          val dy = ty / tl
                          val gx = t.x - dx * 2f * r
                          val gy = t.y - dy * 2f * r
                          var cut = 0f
                          var score = tl
                          if (c != null) {
                              val cx = gx - c.x
                              val cy = gy - c.y
                              val cl = hypot(cx, cy)
                              if (cl < 1f) continue
                              val cosA = ((cx / cl) * dx + (cy / cl) * dy).coerceIn(-1f, 1f)
                              cut = Math.toDegrees(acos(cosA.toDouble())).toFloat()
                              if (cut > 75f) continue
                              if (blocked(pts, c.x, c.y, gx, gy, r) || blocked(pts, t.x, t.y, p.x, p.y, r)) {
                                  blockedCount++
                                  continue
                              }
                              score = cut + 25f * (cl + tl) / w
                          }
                          if (score < bestScore) {
                              bestScore = score
                              best = i
                              bestCut = cut
                              bgx = gx
                              bgy = gy
                          }
                      }
                      if (best >= 0) {
                          val p = ps[best]
                          if (c != null) drawLine(canvas, c, Pt(bgx, bgy), Color.WHITE)
                          ring.color = Color.WHITE
                          canvas.drawCircle(bgx, bgy, r, ring)
                          drawLine(canvas, t, p, Color.YELLOW)
                          drawPoint(canvas, p, Color.GREEN, "LUBANG")
                          val info = if (c != null) {
                              "Saran: lubang %s, sudut potong %.0f°".format(pocketName(best), bestCut)
                          } else {
                              "Saran: lubang %s. Arahkan bola putih ke lingkaran putih".format(pocketName(best))
                          }
                          canvas.drawText(info, dp(24f), height - dp(30f), text)
                      } else if (blockedCount > 0) {
                          canvas.drawText("Semua jalur terhalang bola yang kamu tandai", dp(24f), height - dp(30f), text)
                      } else {
                          canvas.drawText("Tidak ada jalur lurus yang masuk akal", dp(24f), height - dp(30f), text)
                      }
                  }

                  if (locked) return

                  if (pd != null) drawCursor(canvas, pd)

                  canvas.drawRoundRect(width - dp(104f), dp(44f), width - dp(22f), dp(92f), dp(9f), dp(9f), panel)
                  canvas.drawText("RESET", width - dp(88f), dp(74f), text)
                  canvas.drawRoundRect(width - dp(214f), dp(44f), width - dp(112f), dp(92f), dp(9f), dp(9f), panel)
                  canvas.drawText("KALIB", width - dp(198f), dp(74f), text)
                  canvas.drawRoundRect(width - dp(324f), dp(44f), width - dp(222f), dp(92f), dp(9f), dp(9f), panel)
                  canvas.drawText("UNDO", width - dp(306f), dp(74f), text)

                  // joystick
                  canvas.drawCircle(jx(), jy(), jr(), panel)
                  ring.color = Color.WHITE
                  canvas.drawCircle(jx(), jy(), jr(), ring)
                  dot.color = 0xCCFFFFFF.toInt()
                  canvas.drawCircle(jx() + joyDx * jr() * 0.7f, jy() + joyDy * jr() * 0.7f, dp(22f), dot)

                  // tombol PASANG
                  dot.color = 0xCC127D5A.toInt()
                  canvas.drawRoundRect(padLeft(), padTop(), padRight(), padBottom(), dp(12f), dp(12f), dot)
                  text.color = Color.WHITE
                  canvas.drawText("PASANG", padLeft() + dp(20f), padTop() + dp(42f), text)
              }

              private fun drawCursor(c: Canvas, p: Pt) {
                  ring.color = Color.MAGENTA
                  c.drawCircle(p.x, p.y, dp(12f), ring)
                  line.color = Color.MAGENTA
                  line.pathEffect = null
                  c.drawLine(p.x - dp(22f), p.y, p.x + dp(22f), p.y, line)
                  c.drawLine(p.x, p.y - dp(22f), p.x, p.y + dp(22f), line)
              }

              private fun drawPoint(c: Canvas, p: Pt, color: Int, label: String) {
                  dot.color = color
                  c.drawCircle(p.x, p.y, dp(7f), dot)
                  text.color = color
                  c.drawText(label, p.x + dp(10f), p.y - dp(10f), text)
                  text.color = Color.WHITE
              }

              private fun drawLine(c: Canvas, a: Pt, b: Pt, color: Int) {
                  line.color = color
                  line.pathEffect = DashPathEffect(floatArrayOf(dp(9f), dp(7f)), 0f)
                  c.drawLine(a.x, a.y, b.x, b.y, line)
                  line.pathEffect = null
              }

              private fun addPoint(p: Pt) {
                  if (calib.size < 2) {
                      calib.add(p)
                  } else if (shot.size < 10) {
                      shot.add(p)
                  }
              }

              private fun updateJoy(x: Float, y: Float) {
                  var dx = (x - jx()) / jr()
                  var dy = (y - jy()) / jr()
                  val m = hypot(dx, dy)
                  if (m > 1f) {
                      dx /= m
                      dy /= m
                  }
                  joyDx = dx
                  joyDy = dy
              }

              private fun handleDown(id: Int, x: Float, y: Float) {
                  if (y < dp(112f) && x > width - dp(330f)) {
                      if (x > width - dp(112f)) {
                          shot.clear()
                      } else if (x > width - dp(222f)) {
                          calib.clear()
                          shot.clear()
                      } else if (shot.isNotEmpty()) {
                          shot.removeAt(shot.size - 1)
                      } else if (calib.isNotEmpty()) {
                          calib.removeAt(calib.size - 1)
                      }
                  } else if (hypot(x - jx(), y - jy()) <= jr() * 1.5f) {
                      joyId = id
                      updateJoy(x, y)
                  } else if (x >= padLeft() && x <= padRight() && y >= padTop() && y <= padBottom()) {
                      ensureCursor()
                      if (cursorX >= 0f) addPoint(Pt(cursorX, cursorY))
                  }
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN, MotionEvent.ACTION_POINTER_DOWN -> {
                          val i = event.actionIndex
                          handleDown(event.getPointerId(i), event.getX(i), event.getY(i))
                      }
                      MotionEvent.ACTION_MOVE -> {
                          for (i in 0 until event.pointerCount) {
                              if (event.getPointerId(i) == joyId) updateJoy(event.getX(i), event.getY(i))
                          }
                      }
                      MotionEvent.ACTION_UP, MotionEvent.ACTION_POINTER_UP -> {
                          val i = event.actionIndex
                          if (event.getPointerId(i) == joyId) {
                              joyId = -1
                              joyDx = 0f
                              joyDy = 0f
                          }
                      }
                      MotionEvent.ACTION_CANCEL -> {
                          joyId = -1
                          joyDx = 0f
                          joyDy = 0f
                      }
                  }
                  invalidate()
                  return true
              }

              fun resetIfClosed(closed: Boolean) {
                  if (closed) {
                      shot.clear()
                      joyId = -1
                      joyDx = 0f
                      joyDy = 0f
                      invalidate()
                  }
              }

              private fun dp(v: Float): Float = v * resources.displayMetrics.density
          }
          EOF

      - name: Build APK
        run: |
          cd source/PoolAimAssistant
          gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: source/PoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
