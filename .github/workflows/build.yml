name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Extract project
        run: unzip PoolAimAssistant-AndroidStudio.zip -d source

      - name: Build APK
        run: |
          cd source/PoolAimAssistant
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: PoolAimAssistant-APK
          path: source/PoolAimAssistant/app/build/outputs/apk/debug/app-debug.apk
